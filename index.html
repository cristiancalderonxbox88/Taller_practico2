<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tienda de Rosas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1> Tienda de Rosas</h1>
        <nav>
            <button class="nav-btn active" onclick="filtro('todas')">Todas</button>
            <button onclick="filtro('Rojas')">Rojas</button>
            <button onclick="filtro('Blancas')">Blancas</button>
            <button onclick="filtro('Rosadas')">Rosadas</button>
            <button onclick="filtro('Amarillas')">Amarillas</button>
        </nav>
        <button class="cart-btn" onclick="abrirCarrito()">
            <span class="cart-icon"> $ </span>
            <span class="cart-text">Carrito</span>
            <span class="cart-badge" id="contador">0</span>
            <span class="cart-total" id="totalBtn">$0</span>
        </button>
    </header>

    <main>
        <div id="productos"></div>
    </main>

    <!-- Modal del carrito -->
    <div id="modalCarrito" style="display:none;">
        <div id="contenidoCarrito">
            <h4>AGREGADO AL CARRITO</h4>
            <div id="listaCarrito"></div>
            <p><strong>Total: $<span id="totalCarrito">0</span></strong></p>
            <button onclick="cerrarCarrito()">Cerrar</button>
            <button onclick="pagar()">Pagar</button>
            <button onclick="vaciarCarrito()">Vaciar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
